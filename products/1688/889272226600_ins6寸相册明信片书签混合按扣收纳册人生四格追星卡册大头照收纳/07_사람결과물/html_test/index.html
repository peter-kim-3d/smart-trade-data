<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=860, initial-scale=1">
  <title>HTML 상세페이지 렌더링 기술 검증</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 860px; background: #f5f1ea; }
    body {
      color: #26231f;
      font-family: "WenQuanYi Zen Hei", "Unifont", sans-serif;
      word-break: keep-all;
    }
    .page { width: 860px; padding: 56px 54px 64px; }
    .eyebrow {
      margin: 0 0 14px;
      color: #8a6545;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    h1 { margin: 0 0 30px; font-size: 42px; line-height: 1.28; letter-spacing: -0.035em; }
    .product-card {
      overflow: hidden;
      border: 1px solid rgba(84, 62, 42, 0.14);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 18px 46px rgba(76, 56, 38, 0.13);
    }
    .product-card img { display: block; width: 100%; height: 620px; object-fit: cover; }
    .details { padding: 34px 38px 38px; }
    .details h2 { margin: 0 0 20px; font-size: 31px; line-height: 1.35; letter-spacing: -0.025em; }
    .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .spec {
      min-height: 104px;
      padding: 20px 22px;
      border-radius: 18px;
      background: #f3eee7;
    }
    .spec span { display: block; margin-bottom: 7px; color: #8a6545; font-size: 16px; font-weight: 700; }
    .spec strong { font-size: 25px; line-height: 1.3; letter-spacing: -0.02em; }
    .note { margin: 28px 4px 0; color: #6f675f; font-size: 17px; line-height: 1.65; text-align: center; }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">SIZE GUIDE</p>
    <h1>구매 전 사이즈를 확인하세요</h1>
    <section class="product-card">
      <img src="../../06_가공/final_A/메인_06.jpg" alt="네컷 사진 보관 앨범">
      <div class="details">
        <h2>작지만 알차게 담는<br>네컷 사진 보관 앨범</h2>
        <div class="specs">
          <div class="spec"><span>전체 높이</span><strong>높이 17.5cm</strong></div>
          <div class="spec"><span>포켓 규격</span><strong>2칸 포켓 5×16cm</strong></div>
        </div>
      </div>
    </section>
    <p class="note">화면과 실물의 색상은 모니터 환경에 따라 조금 다를 수 있습니다.</p>
  </main>
</body>
</html>
