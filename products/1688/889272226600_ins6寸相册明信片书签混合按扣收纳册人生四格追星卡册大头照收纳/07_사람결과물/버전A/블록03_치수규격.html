<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=860, initial-scale=1">
  <title>블록 03 — 치수·규격</title>
  <style>
    @font-face {
      font-family: "Noto Sans KR Local";
      src: url("./assets/NotoSansKR-Variable.subset.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 860px; background: #eef2f3; }
    body { color: #293034; font-family: "Noto Sans KR Local", sans-serif; word-break: keep-all; }
    .block { width: 860px; min-height: 1110px; padding: 68px 50px 62px; overflow: hidden; }
    .eyebrow { margin: 0 0 14px; color: #597985; font-size: 16px; font-weight: 750; letter-spacing: .19em; }
    h1 { margin: 0 0 34px; font-size: 47px; line-height: 1.25; font-weight: 730; letter-spacing: -.042em; }
    .visual { position: relative; overflow: hidden; width: 760px; height: 760px; border-radius: 30px; background: #edf3f5; box-shadow: 0 21px 54px rgba(48, 71, 78, .13); }
    .visual img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .verified { position: absolute; left: 0; top: 205px; width: 425px; min-height: 188px; padding: 23px 28px 25px 34px; border-radius: 0 24px 24px 0; background: #f6f9f9; box-shadow: 10px 12px 30px rgba(45, 67, 74, .12); }
    .verified small { display: block; margin-bottom: 12px; color: #66828c; font-size: 14px; font-weight: 750; letter-spacing: .12em; }
    .verified p { margin: 7px 0; font-size: 20px; line-height: 1.35; letter-spacing: -.02em; }
    .verified strong { font-size: 24px; font-weight: 760; }
    .note { display: flex; justify-content: space-between; align-items: center; padding: 25px 9px 0; color: #627075; font-size: 16px; }
    .note strong { color: #35454b; font-size: 18px; }
  </style>
</head>
<body>
  <main class="block">
    <p class="eyebrow">SIZE GUIDE</p>
    <h1>구매 전 사이즈를 확인하세요</h1>
    <section class="visual" aria-label="검증된 치수와 포켓 규격">
      <img src="../../06_가공/final_A/메인_06.jpg" alt="두 가지 포켓이 펼쳐진 투명 앨범">
      <div class="verified">
        <small>VERIFIED SIZE</small>
        <p>전체 높이 <strong>17.5cm</strong> · 두께 <strong>2.5cm</strong></p>
        <p>2칸 포켓 <strong>5×16cm</strong></p>
        <p>1칸 포켓 <strong>10.3×16cm</strong></p>
      </div>
    </section>
    <div class="note"><strong>양면 수납</strong><span>스냅 단추는 위로 열려요</span></div>
  </main>
</body>
</html>
