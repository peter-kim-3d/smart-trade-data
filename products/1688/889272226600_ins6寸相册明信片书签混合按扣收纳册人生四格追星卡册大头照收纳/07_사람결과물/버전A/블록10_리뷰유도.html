<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=860, initial-scale=1"><title>블록 10 — 리뷰 유도</title><style>
    @font-face { font-family:"Noto Sans KR Local"; src:url("./assets/NotoSansKR-Variable.subset.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
    *{box-sizing:border-box} html,body{margin:0;width:860px} body{font-family:"Noto Sans KR Local",sans-serif;color:#2f2b27;word-break:keep-all} .block{width:860px;overflow:hidden}.eyebrow{margin:0 0 14px;color:#9a7252;font-size:16px;font-weight:750;letter-spacing:.19em}h1{margin:0;font-size:47px;line-height:1.25;font-weight:730;letter-spacing:-.042em}.sub{margin:18px 0 34px;color:#776e66;font-size:20px;line-height:1.55;letter-spacing:-.02em}.photo{overflow:hidden;border-radius:30px;background:#eee;box-shadow:0 21px 54px rgba(72,55,42,.13)}.photo img{display:block;width:100%;height:100%;object-fit:cover}.pill{display:inline-flex;align-items:center;padding:10px 16px 11px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:.035em}

</style></head><body><main class="block"><p class="eyebrow">SHARE YOUR STORY</p><h1>나만의 한 권을 보여주세요</h1><section class="banner" aria-label="포토리뷰 작성 유도"><div class="icon">□</div><h2>담아 둔 순간을<br>포토리뷰로 공유해 주세요</h2><p>어떤 사진과 기록으로 한 권을 채웠는지<br>당신만의 이야기를 기다릴게요.</p><span class="cta">포토리뷰 작성하기</span></section><p class="note">실제 작성된 리뷰는 판매 페이지에서 확인할 수 있습니다.</p></main></body></html>
