<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=860, initial-scale=1"><title>블록 08 — 안전 표시</title><style>@font-face{font-family:NotoLocal;src:url("./assets/NotoSansKR-Variable.subset.woff2") format("woff2");font-weight:100 900;font-display:block}*{box-sizing:border-box}html,body{margin:0;width:860px}body{font-family:NotoLocal,sans-serif;color:#252829;word-break:keep-all}.block{width:860px;overflow:hidden;padding:70px 52px}.eyebrow{margin:0 0 15px;color:#796c98;font-size:15px;font-weight:800;letter-spacing:.2em}.kicker{margin:0 0 10px;color:#8d829c;font-size:18px;font-weight:650}h1{margin:0;font-size:50px;line-height:1.2;letter-spacing:-.048em;font-weight:780}.sub{margin:18px 0 34px;color:#6f7074;font-size:20px;line-height:1.58;letter-spacing:-.025em}.photo{overflow:hidden;border-radius:30px;background:#f2f1f4;box-shadow:0 22px 56px rgba(54,45,69,.14)}.photo img{display:block;width:100%;height:100%;object-fit:cover}.pill{display:inline-flex;padding:10px 16px 11px;border-radius:999px;font-size:14px;font-weight:750;letter-spacing:.05em}.note{font-size:15px;line-height:1.6;color:#727278}.icon{display:grid;place-items:center;width:62px;height:62px;border-radius:20px;background:#ede8f5;color:#685982;font-size:27px;font-weight:800}html,body{background:#edf3f3}.block{height:700px}.safe{display:grid;grid-template-columns:120px 1fr;gap:28px;align-items:center;margin-top:42px;padding:38px;border-radius:30px;background:#fff;box-shadow:0 18px 45px rgba(52,71,75,.09)}.shield{display:grid;place-items:center;width:120px;height:120px;border-radius:34px;background:#dfeaec;color:#53717a;font-size:47px}.safe strong{display:block;font-size:29px;letter-spacing:-.035em}.safe p{margin:12px 0 0;color:#68777b;font-size:18px;line-height:1.6}.placeholder{margin-top:24px;padding:23px 28px;border:1px dashed #9aadb1;border-radius:22px;color:#5f7479;font-size:17px;line-height:1.6}</style></head><body><main class="block"><p class="eyebrow">SAFETY INFO
